[project]
name = "hexlet-code"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2.18",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
extend-exclude = ["migrations", "task_manager/settings.py"]
